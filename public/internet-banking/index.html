<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Internet Banking</title>
    <link rel="stylesheet" href="/internet-banking/banking.css" />
    <link rel="stylesheet" href="/hidden.css" />
    <script type="module" src="/internet-banking/banking.js"></script>
  </head>
  <body>
    <main id="login" class="login">
      <section class="login-art">
        <a href="/en" class="brand"><span>Z</span><strong>Ziraat </strong></a>
        <div>
          <p>Personal banking</p>
          <h1>Your money, clear and always in view.</h1>
        </div>
        <small>This experience simulates internal transactions. It does not move real money.</small>
      </section>
      <form id="login-form">
        <p class="eyebrow">Secure access</p>
        <h2>Welcome</h2>
        <p>Sign in to your banking account.</p>
        <label>Username<input name="username" autocomplete="username" value="customer.portal" required /></label
        ><label
          >Password<input
            name="password"
            type="password"
            autocomplete="current-password"
            value="Portal2026!"
            required /></label
        ><button>Sign in</button>

        <p class="error" role="alert"></p>
      </form>
    </main>
    <main id="app" class="app" hidden>
      <aside>
        <a href="/en" class="brand"><span>Z</span><strong>Ziraat</strong></a>
        <nav>
          <button class="active" type="button">Overview</button><button id="focus-move" type="button">Transact</button
          ><button id="focus-message" type="button">Messages</button>
        </nav>
        <button id="logout" class="logout" type="button">Sign out</button>
      </aside>
      <section class="content">
        <header>
          <div>
            <p id="greeting">Good morning</p>
            <h1 id="customer-name">Customer</h1>
          </div>
          <div class="avatar">DC</div>
        </header>
        <div id="dashboard"></div>
        <p id="app-error" class="error" role="alert"></p>
      </section>
    </main>
  </body>
</html>
